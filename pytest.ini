[pytest]
# A raiz do projeto entra no sys.path para que "from src.task_analyzer import ..."
# funcione com o comando oficial da atividade:
#     pytest tests/test_harness.py -v
# Sem isto, apenas "python -m pytest" funcionaria, porque esse modo insere o
# diretório atual no sys.path automaticamente. Fixar aqui garante que o comando
# se comporte igual no terminal, no CI e dentro do container.
pythonpath = .
testpaths = tests
