name: CI

# Pilar 1 da Fase 3: integração contínua do TaskAnalyzer.
# O Test Harness (tests/test_harness.py) é o portão de qualidade: nenhum código
# entra em develop ou main sem que os 37 casos de aceite sejam aprovados.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancela execuções antigas da mesma branch para não gastar runner à toa
# (minimização de consumo computacional — seção C do relatório de governança).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Harness (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exibir versões (diagnóstico)
        run: |
          python --version
          pip --version
          python -m pytest --version

      - name: Executar o Test Harness
        run: pytest tests/test_harness.py -v

      - name: Relatório de cobertura
        run: pytest tests/test_harness.py --cov=src --cov-report=term-missing
